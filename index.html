<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlastCrater.net — Coming Soon</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap');

    html, body {
      margin: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #000;
      overflow: hidden;
      font-family: 'Orbitron', sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 30%, rgba(0,255,200,0.08) 0%, transparent 40%),
                  radial-gradient(circle at 80% 70%, rgba(255,100,0,0.08) 0%, transparent 40%),
                  radial-gradient(circle at 50% 120%, rgba(120,0,255,0.06) 0%, transparent 40%);
      background-repeat: no-repeat;
      background-size: 200% 200%;
      animation: shimmer 30s ease-in-out infinite alternate;
      z-index: 0;
    }

    @keyframes shimmer {
      0% { background-position: 10% 40%, 90% 60%, 50% 110%; }
      100% { background-position: 30% 60%, 70% 80%, 40% 90%; }
    }

    img {
      position: relative;
      z-index: 1;
      width: 480px;
      max-width: 85vw;
      height: auto;
      display: block;
      animation: fadeIn 2s ease-in-out;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin-top: 50px;
      font-size: 3rem;
      letter-spacing: 4px;
      color: #ccffcc;
      text-shadow:
        0 0 10px #00ff99,
        0 0 20px #00ff99,
        0 0 40px #007755;
      animation: glow 3s ease-in-out infinite alternate;
    }

    /* Flicker animation for haunted neon effect */
    .flicker {
      display: inline-block;
      animation: flicker 2s infinite;
      /* Start the flickering after 2 seconds */
      animation-delay: 2s;
    }

    /* Unsynchronized delays for each letter */
    .flicker:nth-of-type(1) { animation-delay: 2s; }
    .flicker:nth-of-type(2) { animation-delay: 2.35s; }

    @keyframes flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
      20%, 22%, 24%, 55% { opacity: 0; }
    }

    @keyframes glow {
      from {
        text-shadow:
          0 0 5px #88ff88,
          0 0 15px #00ff99,
          0 0 30px #00ff99;
      }
      to {
        text-shadow:
          0 0 15px #ccffcc,
          0 0 30px #00ffaa,
          0 0 60px #00ffaa;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <img src="blast_crater_dark_v2.png" alt="Blast Crater Explosion">
  <h1>CO<span class="flicker">M</span>ING SO<span class="flicker">O</span>N</h1>
</body>
</html>
