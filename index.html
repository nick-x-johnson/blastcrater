<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Warhammer 40K LoS Simulator</title>
<style>
  body { font-family: sans-serif; background:#1e1e1e; color:#fff; display:flex; flex-direction:column; align-items:center; margin:0; }
  canvas { border:1px solid #555; background:#2e2e2e; margin:10px 0; }
  .controls { margin-top:8px; }
  button { margin:5px; padding:6px 12px; border:none; border-radius:4px; cursor:pointer; background:#444; color:white; }
  button:hover { background:#666; }
</style>
</head>
<body>
<h2>Warhammer 40K LoS Simulator</h2>
<div class="controls">
  <button id="modeDraw">Draw Terrain</button>
  <button id="addUnitBtn">Add Unit</button>
  <button id="modeLoS">Line of Sight</button>
  <button id="toggleGridBtn">Toggle Grid</button>
  <button id="clearBtn">Clear All</button>
</div>

<canvas id="canvas" width="980" height="680"></canvas>

<script>
// ==========================
// CONFIG / STATE
// ==========================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const margin = 40;
const battlefieldWidthPx = 900;
const battlefieldHeightPx = 600;
const battlefieldWidthInches = 72;
const battlefieldHeightInches = 48;
const pixelsPerInchX = battlefieldWidthPx / battlefieldWidthInches;
const pixelsPerInchY = battlefieldHeightPx / battlefieldHeightInches;

let polygons = [], currentPolygon = [];
let units = [], selectedUnits = [], selectedPolygons = [];
let losLines = [];
let lineStartTemp = null, previewEnd = null;

let lastMousePos = {x:0,y:0};
let altKeyDown = false;

let draggingPolygon = null, draggingUnit = null, dragOrigin = null;
let rotatingPolygon = null, rotateOrigin = null, polyCenter = null, initialAngles = [];
let dragOccurred = false, selectionClick = false;

const state = {
  mode: "draw",
  hoveringUnit: false,
  hoveringPolygon: false,
  dragging: false,
  cmdDown: false
};

// ==========================
// HELPERS
// ==========================
function screenToWorld(clientX, clientY){
  const rect = canvas.getBoundingClientRect();
  return {x: clientX - rect.left - margin, y: (canvas.height - margin) - (clientY - rect.top)};
}
function getMouseRaw(e){ return screenToWorld(e.clientX, e.clientY); }

function pointInPolygon(p, poly){
  if(!poly || poly.length<3) return false;
  let inside = false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi = poly[i].x, yi = poly[i].y;
    const xj = poly[j].x, yj = poly[j].y;
    if(((yi>p.y)!==(yj>p.y)) && (p.x < (xj-xi)*(p.y-yi)/(yj-yi)+xi)) inside = !inside;
  }
  return inside;
}

function pointInUnit(p,u){
  const dx = p.x - u.x, dy = p.y - u.y;
  const r = u.r || 10;
  return dx*dx + dy*dy <= r*r;
}

function ccw(A,B,C){ return (C.y-A.y)*(B.x-A.x) > (B.y-A.y)*(C.x-A.x); }
function segIntersects(a,b,c,d){ return ccw(a,c,d)!==ccw(b,c,d) && ccw(a,b,c)!==ccw(a,b,d); }

function lineBlocked(a,b){
  for(const poly of polygons){
    if(!poly || poly.length<2) continue;
    for(let i=0;i<poly.length;i++){
      const c = poly[i], d = poly[(i+1)%poly.length];
      if(segIntersects(a,b,c,d)) return true;
    }
  }
  return false;
}

function getPolygonCenter(poly){
  let cx=0, cy=0;
  for(const p of poly){ cx+=p.x; cy+=p.y; }
  return {x: cx / poly.length, y: cy / poly.length};
}

function getTopVertex(poly){ return poly.reduce((top,p)=> (p.y > top.y ? p : top), poly[0]); }

// ==========================
// CURSOR
// ==========================
function computeHoverStates() {
  state.hoveringUnit = units.some(u => pointInUnit(lastMousePos, u));
  state.hoveringPolygon = polygons.some(p => pointInPolygon(lastMousePos, p));
}

function updateCursor() {
  state.dragging = !!(draggingUnit || draggingPolygon || rotatingPolygon);
  let cursor = "default";

  if(state.dragging){
    cursor = "grabbing";
  } else {
    switch(state.mode){
      case "draw":
        cursor = (state.hoveringUnit || state.hoveringPolygon) ? "grab" : "crosshair";
        break;
      case "los":
        if(state.hoveringUnit) cursor = "pointer";
        else if(state.hoveringPolygon) cursor = "grab";
        else cursor = "crosshair";
        break;
      case "unit":
        cursor = (state.hoveringUnit || state.hoveringPolygon) ? "grab" : "crosshair";
        break;
      default:
        cursor = (state.hoveringUnit || state.hoveringPolygon) ? "pointer" : "default";
    }
  }

  if(state.cmdDown && (state.hoveringUnit || state.hoveringPolygon)) cursor = "pointer";

  canvas.style.cursor = cursor;
}

// ==========================
// DRAW
// ==========================
let showGrid = true;
function drawAll(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(margin, canvas.height - margin);
  ctx.scale(1,-1);

  ctx.lineWidth=1.5; ctx.strokeStyle="#888";
  ctx.strokeRect(0,0,battlefieldWidthPx,battlefieldHeightPx);

  if(showGrid){
    ctx.lineWidth=1; ctx.strokeStyle="#555";
    for(let i=0;i<=battlefieldWidthInches;i+=6){
      const x=i*pixelsPerInchX; ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,battlefieldHeightPx); ctx.stroke();
    }
    for(let i=0;i<=battlefieldHeightInches;i+=6){
      const y=i*pixelsPerInchY; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(battlefieldWidthPx,y); ctx.stroke();
    }
  }

  for(const poly of polygons){
    if(!poly || poly.length<3) continue;
    ctx.beginPath(); ctx.moveTo(poly[0].x,poly[0].y);
    for(let i=1;i<poly.length;i++) ctx.lineTo(poly[i].x,poly[i].y);
    ctx.closePath();
    ctx.fillStyle = selectedPolygons.includes(poly) ? "rgba(255,165,0,0.6)" : "rgba(160,160,160,0.6)";
    ctx.fill(); ctx.strokeStyle="white"; ctx.stroke();
  }

  if(currentPolygon.length>0){
    ctx.strokeStyle="yellow"; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(currentPolygon[0].x,currentPolygon[0].y);
    for(let i=1;i<currentPolygon.length;i++) ctx.lineTo(currentPolygon[i].x,currentPolygon[i].y);
    ctx.stroke();
    if(lastMousePos){
      const last=currentPolygon[currentPolygon.length-1];
      ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(lastMousePos.x,lastMousePos.y); ctx.stroke();
    }
  }

  for(const u of units){
    ctx.beginPath(); ctx.arc(u.x,u.y,u.r||10,0,Math.PI*2);
    ctx.fillStyle = selectedUnits.includes(u)?"orange":"blue";
    ctx.fill(); ctx.strokeStyle="white"; ctx.stroke();
  }

  ctx.lineWidth=2;
  for(const l of losLines){
    if(!l.startUnit||!l.endUnit) continue;
    const s={x:l.startUnit.x,y:l.startUnit.y}, e={x:l.endUnit.x,y:l.endUnit.y};
    ctx.strokeStyle = lineBlocked(s,e)?"red":"lime";
    ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(e.x,e.y); ctx.stroke();
  }

  if(state.mode==="los" && lineStartTemp && previewEnd){
    ctx.setLineDash([6,4]);
    ctx.strokeStyle = lineBlocked(lineStartTemp,previewEnd)?"red":"lime";
    ctx.beginPath(); ctx.moveTo(lineStartTemp.x,lineStartTemp.y); ctx.lineTo(previewEnd.x,previewEnd.y); ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.restore();

  // ticks
  ctx.strokeStyle="white"; ctx.fillStyle="white"; ctx.lineWidth=1.5; ctx.font="12px sans-serif";
  for(let i=0;i<=battlefieldWidthInches;i+=6){
    const x=margin+i*pixelsPerInchX;
    ctx.beginPath(); ctx.moveTo(x,canvas.height-margin); ctx.lineTo(x,canvas.height-margin+6); ctx.stroke();
    ctx.textAlign="center"; ctx.textBaseline="top"; ctx.fillText(i+'"',x,canvas.height-margin+8);
  }
  for(let i=0;i<=battlefieldHeightInches;i+=6){
    const y=canvas.height-margin-i*pixelsPerInchY;
    ctx.beginPath(); ctx.moveTo(margin,y); ctx.lineTo(margin-6,y); ctx.stroke();
    ctx.textAlign="right"; ctx.textBaseline="middle"; ctx.fillText(i+'"',margin-8,y);
  }

  if(altKeyDown){
    for(const poly of polygons){
      const top = getTopVertex(poly);
      const sx = top.x + margin;
      const sy = canvas.height-margin - top.y;
      ctx.beginPath(); ctx.arc(sx,sy,6,0,Math.PI*2);
      ctx.fillStyle = "green"; ctx.fill();
      ctx.strokeStyle="black"; ctx.stroke();
    }
  }
}

// ==========================
// BUTTONS
// ==========================
document.getElementById("modeDraw").onclick = ()=>{ state.mode="draw"; drawAll(); updateCursor(); };
document.getElementById("addUnitBtn").onclick = ()=>{ state.mode="unit"; drawAll(); updateCursor(); };
document.getElementById("modeLoS").onclick = ()=>{ state.mode="los"; drawAll(); updateCursor(); };
document.getElementById("toggleGridBtn").onclick = ()=>{ showGrid=!showGrid; drawAll(); };
document.getElementById("clearBtn").onclick = ()=>{
  polygons=[]; currentPolygon=[]; units=[]; losLines=[];
  selectedUnits=[]; selectedPolygons=[];
  lineStartTemp=null; previewEnd=null;
  state.mode="draw";
  drawAll(); updateCursor();
};

// ==========================
// KEYBOARD
// ==========================
document.addEventListener("keydown", e=>{
  if(e.key==="Alt" && !altKeyDown){ altKeyDown=true; drawAll(); updateCursor(); }
  if(e.key==="Escape"){ currentPolygon=[]; selectedUnits=[]; selectedPolygons=[]; lineStartTemp=null; previewEnd=null; drawAll(); updateCursor(); }
  if(e.key==="Delete" || e.key==="Backspace"){
    polygons = polygons.filter(p=>!selectedPolygons.includes(p));
    const removed = new Set(selectedUnits);
    units = units.filter(u=>!removed.has(u));
    losLines = losLines.filter(l=>!removed.has(l.startUnit)&&!removed.has(l.endUnit));
    selectedUnits=[]; selectedPolygons=[];
    drawAll(); updateCursor();
  }
  if(e.metaKey) { state.cmdDown=true; updateCursor(); }
});
document.addEventListener("keyup", e=>{
  if(e.key==="Alt"){ altKeyDown=false; drawAll(); updateCursor(); }
  if(!e.metaKey){ state.cmdDown=false; updateCursor(); }
});

// ==========================
// MOUSE EVENTS
// ==========================
canvas.addEventListener("mousedown", e=>{
  const m = getMouseRaw(e);
  lastMousePos = {...m}; selectionClick=false; dragOccurred=false;

  // rotation handle
  if(altKeyDown){
    for(const poly of polygons){
      const top = getTopVertex(poly);
      const dx = m.x-top.x, dy = m.y-top.y;
      if(dx*dx+dy*dy<=36){ rotatingPolygon=poly; rotateOrigin={...m}; polyCenter=getPolygonCenter(poly); initialAngles=poly.map(p=>Math.atan2(p.y-polyCenter.y,p.x-polyCenter.x)); return; }
    }
  }

  // multi-select
  if(e.ctrlKey || e.metaKey){
    const u = units.find(u=>pointInUnit(m,u));
    if(u){ selectedUnits.includes(u)?selectedUnits=selectedUnits.filter(x=>x!==u):selectedUnits.push(u); drawAll(); updateCursor(); selectionClick=true; return; }
    const p = polygons.find(p=>pointInPolygon(m,p));
    if(p){ selectedPolygons.includes(p)?selectedPolygons=selectedPolygons.filter(x=>x!==p):selectedPolygons.push(p); drawAll(); updateCursor(); selectionClick=true; return; }
  }

  // dragging
  const u = units.find(u=>pointInUnit(m,u));
  const poly = polygons.find(p=>pointInPolygon(m,p));
  if(u){ draggingUnit=u; dragOrigin={...m}; drawAll(); updateCursor(); return; }
  if(poly){ draggingPolygon=poly; dragOrigin={...m}; drawAll(); updateCursor(); return; }

  // drawing
  if(state.mode==="draw") currentPolygon.push(m);
  if(state.mode==="unit") units.push({x:m.x,y:m.y,r:10});
  drawAll(); updateCursor();
});

canvas.addEventListener("mousemove", e=>{
  lastMousePos = getMouseRaw(e);
  computeHoverStates();
  updateCursor();

  const dx = dragOrigin ? lastMousePos.x - dragOrigin.x : 0;
  const dy = dragOrigin ? lastMousePos.y - dragOrigin.y : 0;
  if(Math.hypot(dx,dy)>2) dragOccurred=true;

  // rotation
  if(rotatingPolygon && rotateOrigin && polyCenter){
    const angleStart = Math.atan2(rotateOrigin.y-polyCenter.y, rotateOrigin.x-polyCenter.x);
    const angleNow = Math.atan2(lastMousePos.y-polyCenter.y, lastMousePos.x-polyCenter.x);
    const delta = angleNow-angleStart;
    for(let i=0;i<rotatingPolygon.length;i++){
      const r = Math.hypot(rotatingPolygon[i].x-polyCenter.x, rotatingPolygon[i].y-polyCenter.y);
      rotatingPolygon[i].x = polyCenter.x + r*Math.cos(initialAngles[i]+delta);
      rotatingPolygon[i].y = polyCenter.y + r*Math.sin(initialAngles[i]+delta);
    }
    drawAll(); updateCursor(); return;
  }

  // dragging
  if(draggingUnit || draggingPolygon){
    if((draggingUnit && selectedUnits.includes(draggingUnit)) || (draggingPolygon && selectedPolygons.includes(draggingPolygon))){
      selectedUnits.forEach(u=>{ u.x+=dx; u.y+=dy; });
      selectedPolygons.forEach(p=>p.forEach(pt=>{ pt.x+=dx; pt.y+=dy; }));
    } else {
      if(draggingUnit) { draggingUnit.x+=dx; draggingUnit.y+=dy; }
      if(draggingPolygon) draggingPolygon.forEach(pt=>{ pt.x+=dx; pt.y+=dy; });
    }
    dragOrigin={...lastMousePos}; drawAll(); updateCursor(); return;
  }

  // live polygon preview
  if(state.mode==="draw" && currentPolygon.length>0){ drawAll(); updateCursor(); return; }

  // LoS preview
  if(state.mode==="los" && lineStartTemp){ previewEnd={x:lastMousePos.x,y:lastMousePos.y}; drawAll(); updateCursor(); return; }
});

canvas.addEventListener("mouseup", e=>{
  if(state.mode==="los" && !dragOccurred && !selectionClick){
    const u = units.find(u=>pointInUnit(lastMousePos,u));
    if(u){
      if(!lineStartTemp) lineStartTemp={unit:u,x:u.x,y:u.y};
      else{ losLines.push({startUnit:lineStartTemp.unit,endUnit:u}); lineStartTemp=null; previewEnd=null; }
    }
  }
  draggingPolygon=null; draggingUnit=null; dragOrigin=null;
  rotatingPolygon=null; rotateOrigin=null; polyCenter=null; dragOccurred=false;
  drawAll(); updateCursor();
});

canvas.addEventListener("dblclick", e=>{
  if(currentPolygon.length>=3){ polygons.push([...currentPolygon]); currentPolygon=[]; drawAll(); updateCursor(); }
});

// ==========================
// INITIAL
// ==========================
computeHoverStates();
updateCursor();
drawAll();
</script>
</body>
</html>
