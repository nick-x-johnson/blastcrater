<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlastCrater.net — Coming Soon</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap');

    html, body {
      margin: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #000;
      overflow: hidden;
      font-family: 'Orbitron', sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 20% 30%, rgba(0,255,200,0.08) 0%, transparent 40%),
                  radial-gradient(circle at 80% 70%, rgba(255,100,0,0.08) 0%, transparent 40%),
                  radial-gradient(circle at 50% 120%, rgba(120,0,255,0.06) 0%, transparent 40%);
      background-repeat: no-repeat;
      background-size: 200% 200%;
      animation: shimmer 30s ease-in-out infinite alternate;
      z-index: 0;
    }

    @keyframes shimmer {
      0% { background-position: 10% 40%, 90% 60%, 50% 110%; }
      100% { background-position: 30% 60%, 70% 80%, 40% 90%; }
    }

    .text-container {
      position: relative;
      /* On Desktop, makes it wider than the viewport to allow glow to bleed */
      width: 120%;          
      max-width: 140vw;     
      padding: 0 10vw;      
      display: flex;
      justify-content: center;
      box-sizing: border-box; 
      z-index: 1;
    }

    /* Media query to ensure safety on small mobile screens */
    @media (max-width: 768px) {
        .text-container {
            width: 100%; /* Collapse to 100% on mobile */
            padding: 0 1rem; /* Standard mobile padding */
            max-width: 100%;
        }
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0; 
      
      /* ADJUSTMENT: Max font size reduced to 3rem to match original fixed size on laptops */
      font-size: clamp(2rem, 8vw, 3rem); 
      line-height: 1.2;
      white-space: nowrap; 
      text-align: center;
      
      letter-spacing: 4px;
      color: #ccffcc;
      text-shadow:
        0 0 10px #00ff99,
        0 0 20px #00ff99,
        0 0 40px #007755;
      animation: glow 3s ease-in-out infinite alternate;
    }

    /* Flicker animation for haunted neon effect */
    .flicker {
      display: inline-block;
      animation: flicker 2s infinite;
      animation-delay: 2s; 
    }

    /* Unsynchronized delays for each letter */
    .flicker:nth-of-type(1) { animation-delay: 2s; }
    .flicker:nth-of-type(2) { animation-delay: 2.35s; }

    @keyframes flicker {
      0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
      20%, 22%, 24%, 55% { opacity: 0; }
    }

    @keyframes glow {
      from {
        text-shadow:
          0 0 5px #88ff88,
          0 0 15px #00ff99,
          0 0 30px #00ff99;
      }
      to {
        text-shadow:
          0 0 15px #ccffcc,
          0 0 30px #00ffaa,
          0 0 60px #00ffaa;
      }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="text-container">
    <h1>CO<span class="flicker">M</span>ING SO<span class="flicker">O</span>N</h1>
  </div>
</body>
</html>
